name: Test
on:
  push:
    # dev too: the fleet develops here, and consumers pin `@dev` while a standards change is
    # unreleased — so an unrun dev tip is six archetypes' CI broken before anyone notices.
    branches: [ main, dev ]
  pull_request:

jobs:
  test:
    name: Lint & self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs a released prova, puts it on PATH, and runs the suite in prova.toml. The generated
      # self-test is hermetic; tests you add that provision a real resource gate on `requires` and
      # skip cleanly here unless you also stand that resource up (Docker is available on the runner).
      - name: Run the plugin's self-test
        uses: prova-rs/run-action@v1
        # No `version:` — the rule E7's proof has held since v1.10, and which this repo was itself
        # breaking. The pin said "per E7" while E7 forbids it, and it froze this suite on v0.16.1
        # after [requires] moved to >= 0.19, so every dev run failed before a single proof ran. The
        # engine version belongs in run-action, which is bumped with each prova release.
        # NOTE rendered-actions-resolve probes github.com deliberately UNAUTHENTICATED — the
        # consumer of record is a customer-org runner with no p6m credentials, so no token here.

      # prova is now on PATH — check the plugin conforms to the namespacing grammar.
      - name: Lint the plugin
        run: prova package lint init.lua

